%YAML:1.0
# 眼在手外标定配置
# 位姿偏移参数：各轴在每个方向上生成 N 个偏移值，N^6 组合
# 默认 3^6 = 729 种

# X 偏移 (mm)
offset_x: [300, 0, -300]
# Y 偏移 (mm)
offset_y: [300, 0, -300]
# Z 偏移 (mm)
offset_z: [100, 0, -100]
# RX 旋转偏移 (deg)
offset_rx: [10, 0, -10]
# RY 旋转偏移 (deg)
offset_ry: [10, 0, -10]
# RZ 旋转偏移 (deg)
offset_rz: [10, 0, -10]

# 单帧最小有效 ChArUco 角点数（低于此值跳过）
min_corners: 12
# 最小有效帧数（低于此值放弃标定）
min_valid_frames: 12
# 相邻采集位姿的最大关节步长 (deg)
maximum_joint_step_degrees: 60

# 拍照前后机器人位姿最大允许变化；超限自动重拍
maximum_capture_translation_drift_mm: 0.10
maximum_capture_rotation_drift_degrees: 0.05

# 生产发布保护。参考文件相对此配置所在目录解析，自动程序不得覆盖参考文件。
reference_result_file: "eye_to_hand_reference.yaml"
require_reference_result: 1
# 每次标定可能更换相机，旧参考必然失效，强制比对只会拦住正确的新标定。
# 置 0 后完全跳过参考比对（即使 eye_to_hand_reference.yaml 存在）。
reference_check_enabled: 0
minimum_publish_frames: 60
maximum_publish_translation_rms_mm: 3.0
maximum_publish_translation_p95_mm: 5.0
maximum_publish_rotation_rms_degrees: 0.5
maximum_publish_translation_drift_mm: 20.0
maximum_publish_rotation_drift_degrees: 2.0
