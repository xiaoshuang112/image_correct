%YAML:1.0
---
# 半自动眼在手标定配置。该文件由可执行文件旁的 param/ 目录加载。
offset_x: [200, 0, -300]
offset_y: [300, 0, -300]
offset_z: [0, 200, 400]
offset_rx: [20, 0, -20]
offset_ry: [20, 0, -20]
offset_rz: [20, 0, -20]

min_corners: 16
min_valid_frames: 10

# 从全部 IK 可达点中选取约 90 个代表性姿态。
maximum_candidates: 90

# 最近邻排序后任一关节仍超过该跳变值时，在运动前拒绝本轮规划。
maximum_joint_step_degrees: 60.0
